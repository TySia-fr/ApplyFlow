# Production-shaped stack for a single VPS (and for running everything locally).
#   docker compose up -d --build
# The app listens on 127.0.0.1 only; Nginx on the host terminates TLS.
name: applyflow

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: applyflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: applyflow
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U applyflow"]
      interval: 5s
      timeout: 5s
      retries: 10
    # No published port: only reachable from the app network.

  migrate:
    build: { context: ., target: migrate }
    environment:
      DATABASE_URL: postgres://applyflow:${POSTGRES_PASSWORD}@db:5432/applyflow
    depends_on:
      db: { condition: service_healthy }
    restart: "no"

  app:
    build: { context: ., target: runtime }
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://applyflow:${POSTGRES_PASSWORD}@db:5432/applyflow
      STORAGE_DRIVER: local
      STORAGE_DIR: /data/storage
    volumes:
      - documents:/data/storage
    ports:
      - "127.0.0.1:${APP_PORT:-3003}:3000"
    depends_on:
      migrate: { condition: service_completed_successfully }
    read_only: true
    tmpfs: [/tmp, /app/.next/cache]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]

volumes:
  pgdata:
  documents:
