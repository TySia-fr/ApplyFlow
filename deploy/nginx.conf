# ApplyFlow, installed by deploy/install.sh. certbot adds the TLS server block.
limit_req_zone $binary_remote_addr zone=applyflow_auth:10m rate=10r/m;

server {
  listen 80;
  listen [::]:80;
  server_name __DOMAIN__;

  client_max_body_size 12m;   # 10 MB uploads + form overhead

  location /api/auth/ {
    limit_req zone=applyflow_auth burst=5 nodelay;
    proxy_pass http://127.0.0.1:__PORT__;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    proxy_pass http://127.0.0.1:__PORT__;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;          # used by the app's rate limits
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;                               # streamed responses
    proxy_read_timeout 60s;
  }
}
