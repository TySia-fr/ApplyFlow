# Production stack: pulls images built by CI, never builds on the server.
#   APP_TAG=sha-abc1234 docker compose -f compose.prod.yaml up -d
# Sized for a small VPS shared with other apps: hard memory limits so this
# stack can't starve its neighbours.
name: applyflow

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: applyflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: applyflow
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=30"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U applyflow"]
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: 256m

  migrate:
    image: ghcr.io/tysia-fr/applyflow-migrate:${APP_TAG:-latest}
    environment:
      DATABASE_URL: postgres://applyflow:${POSTGRES_PASSWORD}@db:5432/applyflow
    depends_on:
      db: { condition: service_healthy }
    restart: "no"
    mem_limit: 256m

  app:
    image: ghcr.io/tysia-fr/applyflow:${APP_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://applyflow:${POSTGRES_PASSWORD}@db:5432/applyflow
      STORAGE_DRIVER: local
      STORAGE_DIR: /data/storage
      NODE_OPTIONS: --max-old-space-size=320
    volumes:
      - documents:/data/storage
    ports:
      - "127.0.0.1:${APP_PORT:-3003}:3000"
    depends_on:
      migrate: { condition: service_completed_successfully }
    read_only: true
    tmpfs: [/tmp, /app/.next/cache]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    mem_limit: 448m
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  pgdata:
  documents:
